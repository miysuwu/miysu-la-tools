<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="icon.png">
<title>Moonfall | loot bid calc</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --bg: #0a0a10;
    --panel: #131319;
    --panel-2: #0d0d13;
    --border: #262530;
    --border-soft: #1c1b24;
    --text: #eae9f2;
    --muted: #8b8a9b;
    --muted-2: #5c5b6b;
    --amber: #f5b942;
    --amber-soft: #7a5e2a;
    --amber-dark: #6b4a20;
    --danger: #ef5a5a;
    --good: #3fe6a4;
    --blue-glow: #3a6ef0;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 44px 20px 70px;
    min-height: 100vh;
    font-variant-numeric: tabular-nums;
  }

  .wrap{ max-width: 1180px; margin: 0 auto; position: relative; }

  /* Navigation Hamburger Menu */
  .top-nav { position: absolute; top: -10px; left: 0; z-index: 100; }
  .menu-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 18px;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .menu-btn:hover { border-color: var(--muted-2); background: var(--panel-2); }
  .menu-dropdown {
    display: none;
    position: absolute;
    top: 110%;
    left: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    min-width: 180px;
    overflow: hidden;
  }
  .menu-dropdown.show { display: block; }
  .menu-dropdown a {
    display: block;
    padding: 10px 16px;
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    border-bottom: 1px solid var(--border-soft);
    transition: background 0.15s ease;
  }
  .menu-dropdown a:last-child { border-bottom: none; }
  .menu-dropdown a:hover { background: var(--panel-2); color: var(--amber); }
  .menu-dropdown a.active { color: var(--amber); }

  header{ margin-bottom: 26px; text-align: center; }
  .eyebrow{
    font-size: 11px; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--amber); margin-bottom: 10px;
  }
  h1{ font-size: clamp(24px, 3.6vw, 32px); font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  .sub{ font-size: 12px; color: var(--muted); margin-top: 8px; }

  .layout{ display:grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: stretch; }
  @media (max-width: 820px){ .layout{ grid-template-columns: 1fr; } }

  .card{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 26px 26px 30px;
    position: relative;
  }
  .card.results{ display:flex; flex-direction:column; }
  .card.results .card-title{ flex: none; }
  .results-content{ flex: 1; display:flex; flex-direction:column; justify-content:center; }

  .card-title{ font-size: 18px; font-weight: 700; margin: 0 0 22px; }

  label{
    display:flex; align-items:center; gap:6px;
    font-size: 10.5px; font-weight: 600;
    letter-spacing:.07em; text-transform:uppercase; color: var(--muted);
    margin-bottom: 10px;
  }
  .field{ margin-bottom: 26px; }

  input.price-input{
    font-family: 'Inter', sans-serif;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); font-size: 18px; font-weight: 700; padding: 13px 14px;
    border-radius: 10px; outline:none; width:100%;
  }
  input.price-input:focus{ border-color: var(--amber-dark); }
  input.price-input::placeholder{ color: var(--muted-2); }

  .segmented{ display:flex; gap: 10px; flex-wrap: wrap; }
  .seg-btn{
    flex: 1;
    min-width: 70px;
    font-family:'Inter', sans-serif;
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-size: 14px; font-weight: 700;
    padding: 13px 14px; border-radius: 10px; cursor:pointer;
    text-align:center;
    transition: all .15s ease;
  }
  .seg-btn:hover{ border-color: var(--muted-2); color: var(--text); }
  .seg-btn.active{
    background: var(--amber-dark);
    border-color: var(--amber);
    color: var(--amber-2);
  }

  .intent-row{ display:flex; gap:8px; flex-wrap: wrap; }
  .intent-row .seg-btn{ flex: 1 1 auto; min-width: 130px; font-size: 13px; padding: 12px 12px; }

  .info-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:13px; height:13px; border-radius:50%;
    border:1px solid var(--muted-2); color: var(--muted-2);
    font-size:9px; font-weight:800;
    cursor: help; position: relative;
  }
  .info-icon .tip{
    display:none;
    position:absolute; top: 150%; left: 0; transform: none;
    background: var(--panel-2); border:1px solid var(--border);
    color: var(--muted); font-size: 11px; font-weight: 500;
    text-transform:none; letter-spacing:0;
    padding: 10px 12px; border-radius: 8px;
    width: max-content; max-width: min(280px, 80vw);
    line-height: 1.5; box-shadow: 0 8px 20px rgba(0,0,0,0.5); z-index: 50;
  }
  .info-icon:hover .tip{ display:block; }

  /* --- Bid Details panel --- */
  .amount-block{ text-align:center; margin-bottom: 8px; }
  .amount-label{ font-size: 10.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color: var(--muted-2); margin-bottom: 14px; }
  .amount-row{ display:flex; align-items:stretch; justify-content:center; gap: 10px; max-width: 320px; margin: 0 auto; }
  .amount-pill{
    flex: 1;
    display:inline-flex; align-items:center; justify-content:center; gap: 9px;
    background: var(--amber-dark);
    border: 1px solid var(--amber);
    color: var(--amber-2);
    font-size: 15px; font-weight: 700;
    padding: 13px 14px; border-radius: 10px;
  }
  .amount-pill img{ width: 18px; height: 18px; flex-shrink:0; display:block; }
  .copy-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width: 46px;
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); border-radius: 10px; cursor:pointer;
    transition: all .15s ease; flex-shrink:0;
  }
  .copy-btn:hover{ border-color: var(--muted-2); color: var(--text); }
  .copy-btn.copied{ border-color: var(--good); color: var(--good); }
  .copy-btn svg{ width:16px; height:16px; }

  .who-block{ position: relative; text-align:center; margin: 30px 0 4px; }
  .who-glow{
    position:absolute; left:50%; top:50%; transform: translate(-50%,-50%);
    width: 110px; height: 45px; border-radius: 50%;
    filter: blur(26px); opacity: .35; pointer-events:none; z-index:0;
  }
  .who-glow.you{ background: var(--blue-glow); }
  .who-glow.next{ background: var(--danger); }
  .who-heading{ position:relative; z-index:1; font-size: 15px; font-weight: 800; }

  table.bid-table{ width:100%; table-layout: fixed; border-collapse:collapse; margin-top: 14px; }
  table.bid-table th{
    text-align:center; font-size: 10px; text-transform:uppercase; letter-spacing:.06em;
    color: var(--muted-2); font-weight:700; padding: 0 6px 12px; border-bottom:1px solid var(--border);
  }
  table.bid-table td{ text-align:center; font-size: 16px; font-weight: 700; padding: 14px 6px 4px; }
  table.bid-table td.neg{ color: var(--danger); }
  table.bid-table td.pos{ color: var(--text); }

  .formula-note{ font-size: 11.5px; color: var(--muted-2); text-align:center; margin-top: 24px; line-height: 1.6; }

  footer{ text-align:center; color: var(--muted-2); font-size: 11.5px; margin-top: 26px; line-height:1.6; }
  footer code{ color: var(--muted); }
</style>

<script>
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('en-US');

  /* ---------- Navigation Menu ---------- */
  function initMenu(){
    const menuBtn = $('menuBtn');
    const menuDropdown = $('menuDropdown');
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      menuDropdown.classList.toggle('show');
    });
    document.addEventListener('click', () => menuDropdown.classList.remove('show'));
  }

  const TAX_RATE = 0.05;
  const MIN_RAISE = 0.10; // next bid must be at least 10% higher

  let raidSize = 4;
  let intent = 'equal';

  /* ---------- Formatted number input (thousands separators as you type) ---------- */
  function parseNumberInput(str){
    const digits = (str || '').replace(/[^\d]/g, '');
    return digits ? parseInt(digits, 10) : 0;
  }
  function initPriceInput(){
    const input = $('marketPrice');
    input.addEventListener('input', () => {
      const value = parseNumberInput(input.value);
      input.value = value ? value.toLocaleString('en-US') : '';
      render();
    });
    input.addEventListener('blur', () => {
      if(!input.value) input.value = '0';
    });
  }
  function getMarketPrice(){
    return parseNumberInput($('marketPrice').value);
  }

  function initSegmented(containerId, dataAttr, onPick){
    const container = $(containerId);
    container.querySelectorAll('.seg-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        container.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        onPick(btn.dataset[dataAttr]);
      });
    });
  }

  // Exact "Profit & Punish Next Bidder" ratios (bid ÷ net sell value), calibrated
  // against a reference tool for a similar game: at raid size 4 a 100,000 market
  // price item (net value 95,000) bids 69,500; at raid size 8 it bids 78,000
  // I HAVE NO IDEA OF THE MATH THIS SHOULD BE LOL
  const PUNISH_FRACTION = { 4: 139 / 190, 8: 78 / 95 };

  function calcBid(V, n, intentKey){
    const m = n - 1; // other players
    const equalBid = V * m / n; // fair split, also the break-even point past which outbidding never pays off
    if(intentKey === 'equal') return equalBid;
    if(intentKey === 'max') return equalBid / 1.1; // the highest bid still low enough that a minimum 10% raise reaches the fair-split threshold
    if(intentKey === 'punish'){
      const frac = PUNISH_FRACTION[n] !== undefined ? PUNISH_FRACTION[n] : (equalBid + V) / 2 / V;
      return V * frac;
    }
    return equalBid;
  }

  function render(){
    const marketPrice = getMarketPrice();
    const V = marketPrice * (1 - TAX_RATE); // net sell value after 5% market tax
    const n = raidSize;
    const m = n - 1;

    const bid = Math.max(0, calcBid(V, n, intent));
    const yourProfit = V - bid;
    const partyProfitEach = m > 0 ? bid / m : 0;

    // Minimum next bid: 10% higher than the current bid (e.g. 50 -> 55)
    const nextBid = bid * (1 + MIN_RAISE);
    const nextProfit = V - nextBid;
    const nextPartyEach = m > 0 ? nextBid / m : 0;

    $('amountToBid').textContent = fmt(bid);

    $('youBid').textContent = fmt(bid);
    $('youProfit').textContent = fmt(yourProfit);
    $('youProfit').className = yourProfit < 0 ? 'neg' : 'pos';
    $('youParty').textContent = fmt(partyProfitEach);

    $('nextBid').textContent = fmt(nextBid);
    $('nextProfit').textContent = fmt(nextProfit);
    $('nextProfit').className = nextProfit < 0 ? 'neg' : 'pos';
    $('nextParty').textContent = fmt(nextPartyEach);

    const notes = {
      equal: `You and each of the other ${m} players end up with ${fmt(V / n)} profit - perfectly equal.`,
      punish: `You give up some profit versus Equal Profit in exchange for a much stronger deterrent. Useful if you need it yourself.`,
      max: `The lowest bid where someone else would just reach the fair-split threshold.`
    };
    $('formulaNote').textContent = notes[intent] || '';
  }

  function initCopy(){
    $('copyBtn').addEventListener('click', async () => {
      const value = $('amountToBid').textContent.replace(/,/g, '');
      try{
        await navigator.clipboard.writeText(value);
      }catch(err){
        const ta = document.createElement('textarea');
        ta.value = value;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      const btn = $('copyBtn');
      btn.classList.add('copied');
      setTimeout(() => btn.classList.remove('copied'), 1200);
    });
  }

  function init(){
    initMenu();
    initCopy();
    initPriceInput();

    initSegmented('raidSizeGroup', 'size', (val) => { raidSize = parseInt(val, 10); render(); });
    initSegmented('intentGroup', 'intent', (val) => { intent = val; render(); });

    render();
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
